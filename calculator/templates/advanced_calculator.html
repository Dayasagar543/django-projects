{% extends "base.html" %} {% block content %}

<form method="get">
  {% comment %} {% csrf_token %} {% endcomment %}
  <div>
    <label for="num1">num1</label>
    <input type="text" name="num1" value="{{num1}}" id="num1" class=" " />
  </div>

  <div>
    <label for="num2">num2</label>
    <input type="text" name="num2" value="{{num2}}" id="num2" class=" " />
  </div>

  <label for="operation">operation</label>
  <select name="operation" id="operation">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
  </select>

  <button type="submit">caluculate</button>
  <div>
    <label for="result">result</label>
    <input type="text" name="result" id="result" value="{{result}}" />
  </div>
</form>

<div>
  <h1>
    data is
    <p>{{num1}}</p>
    <p>{{num2}}</p>
    <p>{{result}}</p>
  </h1>
</div>

{% endblock %}
