{% extends "base.html" %} {% block content %}
<div class="w-full flex flex-col justify-center items-center">
  <h2 class="text-center">Contact CHINUCH</h2>

  <form
    action=""
    method="POST"
    class="border-2 text-center w-[70vw] h-[80vh] rounded-md flex flex-col justify-evenly items-start"
  >
    {% csrf_token %}
    <div>
      <label for="firstname">First Name: </label>
      <input type="text" id="firstname" class="border-2 rounded-sm" />
    </div>
    <div>
      <label for="lastname">last Name: </label>
      <input type="text" id="lastname" class="border-2 rounded-sm" />
    </div>
    <div>
      <label for="age">Age: </label>
      <input type="text" id="age" class="border-2 rounded-sm" />
    </div>
    <div>
      <label for="gender">Gender: </label>
      <input type="text" id="gender" class="border-2 rounded-sm" />
    </div>
    <div>
      <label for="phoneno">Phoneno: </label>
      <input type="text" id="phoneno" class="border-2 rounded-sm" />
    </div>
    <div>
      <label for="email">email: </label>
      <input type="email" id="email" class="border-2 rounded-sm" />
    </div>
    <div>
      <label for="password">password: </label>
      <input type="password" id="password" class="border-2 rounded-sm" />
    </div>
    <div class="w-full flex justify-center items-center">
      <button class="rounded-md border-2 w-5xl h-2xl">submit</button>
    </div>
  </form>
</div>
{% endblock %}
